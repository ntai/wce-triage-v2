[tool.poetry]
name = "wce-triage"
version = "0.7.0"
description = "WCE Triage"
authors = ["Naoyuki Tai <ntaigit@cleanwinner.com>"]
license = "BSD-3"
readme = "README.rst"
repository = "https://github.com/ntai/wce-triage-v2"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux"
]
exclude = ["wce_triage/.idea", "wce_triage/backend"]
include = ["wce_triage/setup/patches/**/*",
           "wce_triage/setup/share/**/*",
	   ]
packages = [{include = "wce_triage"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "*"
uvicorn = "*"
python-socketio = {extras = ["asyncio"], version = "*"}
typing-extensions = "*"
ruamel-yaml = "*"
pydantic = "*"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
